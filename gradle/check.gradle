apply plugin: 'com.github.spotbugs'
apply plugin: 'pmd'
apply plugin: 'jacoco'
apply plugin: 'org.owasp.dependencycheck'

dependencyCheck {
    failOnError = false
    formats = ['ALL']
    failBuildOnCVSS = 11
}

spotbugs {
    ignoreFailures = false
    excludeFilter = file("codequality/findbugs.xml")
}

// FindBugs only analyzed main; keep SpotBugs to the same scope.
tasks.matching { it.name.startsWith('spotbugs') && it.name != 'spotbugsMain' }.configureEach {
    enabled = false
}

tasks.named('spotbugsMain') {
    reports {
        xml { required = true }
        html { required = true }
    }
}

pmd {
    toolVersion = '7.28.0'
    sourceSets = [ project.sourceSets.main ]
    ruleSets = []
    ruleSetFiles = files("codequality/pmd-ruleset.xml")
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}
test.finalizedBy(jacocoTestReport)

// dependencyCheckAnalyze is no longer wired into `check`: it downloads the full NVD database, which now needs an
// NVD API key and can take hours. Run `./gradlew dependencyCheckAnalyze` explicitly (see MIGRATION.md).
